name: Rust learning CI

on:
  push:
    branches:
      - "learn/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run unit tests
        run: cargo test --all-targets
